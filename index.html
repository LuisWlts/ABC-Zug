<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#b3261e">

<title>ABC-Zug Kreis Heinsberg – Fahrzeug-Checklisten</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{--red:#b3261e;--red-d:#8c1d17;--bg:#f4f4f2;--card:#fff;--ink:#1d1d1b;--mute:#6b6b66;--line:#dcdcd6;--ok:#2e7d32;--warn:#e08a00;--bad:#b3261e}
  *{box-sizing:border-box}
  body{margin:0;font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}
  header{background:var(--red);color:#fff;padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top));padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right));display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  header h1{font-size:17px;margin:0;flex:1 1 190px}
  .hdr-user{display:flex;align-items:center;gap:10px;margin-left:auto}
  header{padding-top:calc(8px + env(safe-area-inset-top))!important;padding-bottom:8px;gap:6px 12px}
  header button.btn{min-height:36px;padding:5px 12px;font-size:14px}
  header small{opacity:.85;display:block;font-weight:400;font-size:12px}
  header .who{font-size:13px;opacity:.9}
  /* Handy: Navigation unten, gut mit dem Daumen erreichbar */
  nav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -2px 8px rgba(0,0,0,.06)}
  nav button{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 7px;border:0;border-top:3px solid transparent;background:none;font:inherit;font-size:11px;font-weight:600;color:var(--mute);cursor:pointer}
  nav button .ic{font-size:21px;line-height:1}
  nav button.on{color:var(--red);border-top-color:var(--red)}
  main{max-width:820px;margin:0 auto;padding:16px;padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right));padding-bottom:calc(96px + env(safe-area-inset-bottom))}
  body.nonav main{padding-bottom:32px}
  /* Tablet und größer: Navigation oben, breiterer Inhalt */
  @media (min-width:700px){
    nav{position:sticky;top:0;bottom:auto;border-top:0;border-bottom:1px solid var(--line);padding-bottom:0;box-shadow:none}
    nav button{flex-direction:row;justify-content:center;gap:8px;font-size:15px;padding:14px 8px;border-top:0;border-bottom:3px solid transparent}
    nav button .ic{font-size:18px}
    nav button.on{border-bottom-color:var(--red)}
    main{max-width:980px;padding-bottom:32px}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .grid .card{margin-bottom:0}
    .stickybar{top:50px!important}
    .err,.info{top:58px!important}
  }
  h2{margin:8px 0 12px;font-size:20px}
  h3{margin:20px 0 8px;font-size:15px;text-transform:uppercase;letter-spacing:.04em;color:var(--mute)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .grow{flex:1;min-width:0}
  .muted{color:var(--mute);font-size:14px}
  button,[data-act]{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%}
  button.btn{background:var(--red);color:#fff;border:0;border-radius:10px;padding:12px 16px;min-height:48px;font:inherit;font-weight:600;cursor:pointer}
  button.btn:hover{background:var(--red-d)}
  button.btn.sec{background:#fff;color:var(--red);border:1px solid var(--red)}
  button.btn.small{padding:9px 14px;min-height:44px;font-size:15px}
  button.btn:disabled{opacity:.5;cursor:default}
  input,select,textarea{font:inherit;padding:11px;min-height:48px;border:1px solid var(--line);border-radius:10px;background:#fff;width:100%}
  form.row>.grow{min-width:150px}
  textarea{min-height:110px}
  label{display:block;font-size:13px;font-weight:600;color:var(--mute);margin:10px 0 4px}
  .vehicle{display:flex;justify-content:space-between;align-items:center;cursor:pointer}
  .vehicle:hover{border-color:var(--red)}
  .vehicle b{font-size:18px}
  .item{padding:12px 0;border-top:1px solid var(--line)}
  .item:first-child{border-top:0}
  .seg{display:flex;gap:6px;margin-top:8px}
  .seg button{flex:1;min-height:54px;font-size:16px;padding:11px 4px;border:2px solid var(--line);background:#fff;border-radius:10px;font:inherit;font-weight:700;cursor:pointer;color:var(--mute)}
  .seg button.ok.on{background:var(--ok);border-color:var(--ok);color:#fff}
  .seg button.fehlt.on{background:var(--bad);border-color:var(--bad);color:#fff}
  .seg button.defekt.on{background:var(--warn);border-color:var(--warn);color:#fff}
  .extra{display:grid;grid-template-columns:110px 1fr;gap:8px;margin-top:8px}
  .progress{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin:6px 0 14px}
  .progress i{display:block;height:100%;background:var(--ok)}
  .tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700;color:#fff}
  .children{margin-top:10px;padding:8px 12px;background:#faf9f7;border-left:3px solid var(--red);border-radius:8px}
  .subitem{padding:10px 0;border-top:1px dashed var(--line)}
  .children .subitem:first-of-type{margin-top:8px}
  .hidden{display:none!important}
  .tag.grey{background:#8a8a84}
  details>summary{cursor:pointer}
  .tag.fehlt{background:var(--bad)}.tag.defekt{background:var(--warn)}.tag.ok{background:var(--ok)}
  .err{background:#fdecea;color:var(--bad);padding:10px 12px;border-radius:10px;margin:10px 0;position:sticky;top:8px;z-index:25;box-shadow:0 2px 8px rgba(0,0,0,.12)}
  .info{background:#e8f1fb;color:#1a4b8c;padding:10px 12px;border-radius:10px;margin:10px 0;position:sticky;top:8px;z-index:25;box-shadow:0 2px 8px rgba(0,0,0,.12)}
  .stickybar{position:sticky;top:0;z-index:10;background:var(--bg);padding:6px 0 2px;margin-bottom:6px}
  .stickybar .progress{margin-bottom:6px}
  .stepper{display:flex;align-items:center;gap:6px;flex-wrap:nowrap}
  .stepper button{width:46px;min-height:46px;border:1px solid var(--line);background:#fff;border-radius:10px;font-size:22px;font-weight:700;line-height:1;cursor:pointer;color:var(--red)}
  .stepper input{width:76px;text-align:center}
  body.busy::before{content:"";position:fixed;top:0;left:0;height:3px;width:40%;background:var(--red);z-index:100;animation:busy 1s ease-in-out infinite}
  @keyframes busy{0%{left:-40%}100%{left:100%}}
  .login{max-width:380px;margin:40px auto}
  .bestellt{opacity:.55}
  .check{display:flex;gap:10px;align-items:flex-start}
  .check input{width:30px;height:30px;min-height:0;margin-top:0;flex:none}
  .check{padding:4px 0}
  .top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
  @media print{header,nav,.noprint{display:none!important}body{background:#fff}}
</style>
</head>
<body>
<div id="root"></div>

<script>
const SUPABASE_URL = "https://ixattemgeulwwogzwusk.supabase.co";
const SUPABASE_KEY = "sb_publishable_151mPC0VJp5T3TWJNtYX8A_OAMLuRMh";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// Benutzername "Vorname.Nachname" wird intern zu dieser E-Mail-Adresse
const USER_DOMAIN = "abc-zug-heinsberg.de";
const toEmail = u => { u = u.trim().toLowerCase(); return u.includes("@") ? u : u + "@" + USER_DOMAIN; };
const TAB_ICON = { pruefen:"✅", fehlbestand:"⚠️", historie:"🕘", geraete:"🔧", lager:"📦", verwaltung:"⚙️" };
const ROLE_LABEL = { nutzer:"Nutzer", geraetewart:"Gerätewart", einheitsfuehrung:"Einheitsführung", admin:"Admin" };

const S = { session:null, profile:null, tab:"pruefen", msg:null, err:null, insp:null, mgVehicle:null, editDevice:null, editStock:null, pwUser:null };
const $root = document.getElementById("root");
const isGW = () => S.profile && ["geraetewart", "einheitsfuehrung", "admin"].includes(S.profile.role);
const isAdmin = () => S.profile && S.profile.role === "admin";
const isUM = () => S.profile && (S.profile.role === "admin" || S.profile.role === "einheitsfuehrung"); // darf Benutzer verwalten
const today = () => new Date().toISOString().slice(0,10);
const fmtDate = d => d ? new Date(d + "T00:00:00").toLocaleDateString("de-DE") : "–";
function addMonths(dateStr, m){
  const d = new Date(dateStr + "T00:00:00Z");
  const day = d.getUTCDate();
  d.setUTCDate(1); d.setUTCMonth(d.getUTCMonth() + m);
  const last = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + 1, 0)).getUTCDate();
  d.setUTCDate(Math.min(day, last));
  return d.toISOString().slice(0,10);
}
function daysUntil(dateStr){
  if (!dateStr) return null;
  const a = new Date(today() + "T00:00:00Z"), b = new Date(dateStr + "T00:00:00Z");
  return Math.round((b - a) / 86400000);
}
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = d => d ? new Date(d).toLocaleString("de-DE",{dateStyle:"short",timeStyle:"short"}) : "–";
const fail = e => { S.err = e && e.message ? e.message : String(e); };

function shell(content){
  const tabs = [["pruefen","Prüfen"]].concat(isGW() ? [["fehlbestand","Fehlbestand"],["historie","Historie"],["geraete","Geräte"],["lager","Lager"],["verwaltung","Verwaltung"]] : []);
  return `
  <header>
    <h1>ABC-Zug Kreis Heinsberg<small>Fahrzeug-Checklisten</small></h1>
    <div class="hdr-user"><span class="who">${esc(S.profile?.name || "")} · ${ROLE_LABEL[S.profile?.role] || ""}</span>
    <button class="btn sec small" data-act="logout">Abmelden</button></div>
  </header>
  ${tabs.length > 1 ? `<nav>${tabs.map(([k,l]) => `<button data-act="tab" data-tab="${k}" class="${S.tab===k?"on":""}"><span class="ic">${TAB_ICON[k]||""}</span><span>${l}</span></button>`).join("")}</nav>` : ""}
  <main>
    ${S.err ? `<div class="err">${esc(S.err)}</div>` : ""}
    ${S.msg ? `<div class="info">${esc(S.msg)}</div>` : ""}
    ${content}
  </main>`;
}

/* ---------- Login ---------- */
function renderLogin(){
  $root.innerHTML = `
  <header><h1>ABC-Zug Kreis Heinsberg<small>Fahrzeug-Checklisten</small></h1></header>
  <div class="login card">
    <h2>Anmelden</h2>
    ${S.err ? `<div class="err">${esc(S.err)}</div>` : ""}
    <form id="loginForm">
      <label>Benutzername (Vorname.Nachname)</label><input type="text" id="email" autocomplete="username" autocapitalize="none" placeholder="Vorname.Nachname" required>
      <label>Passwort</label><input type="password" id="pw" autocomplete="current-password" required>
      <div style="margin-top:16px"><button class="btn" style="width:100%">Anmelden</button></div>
    </form>
    <p class="muted">Zugänge werden vom Admin angelegt.</p>
  </div>`;
  document.getElementById("loginForm").onsubmit = async e => {
    e.preventDefault();
    S.err = null;
    const { error } = await sb.auth.signInWithPassword({
      email: toEmail(document.getElementById("email").value),
      password: document.getElementById("pw").value
    });
    if (error){ S.err = "Anmeldung fehlgeschlagen: " + error.message; renderLogin(); }
  };
}

/* ---------- Prüfen ---------- */
async function viewPruefen(){
  if (S.insp) return viewInspection();
  const { data: vehicles, error } = await sb.from("vehicles").select("*").eq("active", true).order("sort").order("name");
  if (error) fail(error);
  const { data: open } = await sb.from("inspections").select("vehicle_id").eq("inspector_id", S.session.user.id).is("completed_at", null);
  const openSet = new Set((open||[]).map(o => o.vehicle_id));
  const { data: last } = await sb.from("inspections").select("vehicle_id,completed_at").not("completed_at","is",null).order("completed_at",{ascending:false});
  const lastBy = {};
  (last||[]).forEach(l => { if(!lastBy[l.vehicle_id]) lastBy[l.vehicle_id] = l.completed_at; });
  return `<h2>Fahrzeug wählen</h2>` + ((vehicles||[]).length ? '<div class="grid">' + vehicles.map(v => `
    <div class="card vehicle" data-act="start" data-id="${v.id}">
      <div><b>${esc(v.name)}</b><div class="muted">${esc(v.kennzeichen||"")}${v.kennzeichen?" · ":""}zuletzt geprüft: ${fmt(lastBy[v.id])}</div></div>
      <span class="tag ${openSet.has(v.id)?"defekt":"ok"}">${openSet.has(v.id)?"Fortsetzen":"Prüfen"}</span>
    </div>`).join("") + '</div>' : `<div class="card muted">Noch keine Fahrzeuge angelegt. ${isGW()?"Das geht unter „Verwaltung“.":"Bitte den Gerätewart fragen."}</div>`);
}

async function startInspection(vehicleId){
  S.err = null;
  const [{ data: veh }, { data: items, error: e1 }] = await Promise.all([
    sb.from("vehicles").select("*").eq("id", vehicleId).single(),
    sb.from("checklist_items").select("*").eq("vehicle_id", vehicleId).eq("active", true).order("bereich").order("sort").order("name")
  ]);
  if (e1) return fail(e1);
  let { data: insp } = await sb.from("inspections").select("*").eq("vehicle_id", vehicleId).eq("inspector_id", S.session.user.id).is("completed_at", null).limit(1).maybeSingle();
  if (!insp){
    const r = await sb.from("inspections").insert({ vehicle_id: vehicleId }).select().single();
    if (r.error) return fail(r.error);
    insp = r.data;
  }
  const { data: res } = await sb.from("inspection_results").select("*").eq("inspection_id", insp.id);
  const map = {}; (res||[]).forEach(r => map[r.item_id] = r);
  S.insp = { insp, vehicle: veh, items: items||[], results: map };
}

function itemRow(i, results, isChild){
  const r = results[i.id];
  const st = r?.status;
  return `<div class="${isChild ? "subitem" : "item"}" data-item="${i.id}">
    <div class="row"><div class="grow"><b>${esc(i.name)}</b></div><span class="muted">Soll: ${i.soll_menge}</span></div>
    <div class="seg">
      <button class="ok ${st==="ok"?"on":""}" data-act="status" data-s="ok" data-id="${i.id}">✓ OK</button>
      <button class="fehlt ${st==="fehlt"?"on":""}" data-act="status" data-s="fehlt" data-id="${i.id}">Fehlt</button>
      <button class="defekt ${st==="defekt"?"on":""}" data-act="status" data-s="defekt" data-id="${i.id}">Defekt</button>
    </div>
    ${st && st!=="ok" ? `<div class="extra">
      <input type="number" min="0" inputmode="numeric" placeholder="Ist" value="${r.ist_menge ?? ""}" data-act="ist" data-id="${i.id}">
      <input type="text" placeholder="Bemerkung (optional)" value="${esc(r.note||"")}" data-act="note" data-id="${i.id}">
    </div>` : ""}`;
}

function viewInspection(){
  const { vehicle, items, results } = S.insp;
  const open = S.open || (S.open = {});
  const kidsOf = pid => items.filter(c => c.parent_id === pid);
  const tops = items.filter(i => !i.parent_id);
  const req = [];
  tops.forEach(t => { req.push(t); if (results[t.id]?.status !== "fehlt") kidsOf(t.id).forEach(c => req.push(c)); });
  const done = req.filter(i => results[i.id]).length;
  const pct = req.length ? Math.round(done/req.length*100) : 0;
  const groups = {};
  tops.forEach(i => (groups[i.bereich] = groups[i.bereich] || []).push(i));
  let html = `
    <div class="top"><h2>${esc(vehicle.name)}</h2><button class="btn sec small" data-act="back">← Zurück</button></div>
    <div class="stickybar"><div class="muted">${done} von ${req.length} Positionen geprüft</div>
    <div class="progress"><i style="width:${pct}%"></i></div></div>`;
  if (!items.length) html += `<div class="card muted">Für dieses Fahrzeug gibt es noch keine Checkliste.</div>`;
  for (const [bereich, list] of Object.entries(groups)){
    html += `<h3>${esc(bereich)}</h3><div class="card">` + list.map(i => {
      const kids = kidsOf(i.id);
      let inner = itemRow(i, results, false);
      if (kids.length){
        if (results[i.id]?.status === "fehlt"){
          inner += `<div class="muted" style="margin-top:8px">Inhalt entfällt, da nicht vorhanden.</div>`;
        } else {
          const kd = kids.filter(c => results[c.id]).length;
          inner += `<button class="btn sec small" style="margin-top:10px" data-act="toggle" data-id="${i.id}">${open[i.id] ? "▾" : "▸"} Inhalt (${kd}/${kids.length} geprüft)</button>`;
          if (open[i.id]){
            inner += `<div class="children">
              <button class="btn small" data-act="allok" data-id="${i.id}">Alle offenen Inhalte auf OK</button>
              ${kids.map(c => itemRow(c, results, true) + `</div>`).join("")}
            </div>`;
          }
        }
      }
      return inner + `</div>`;
    }).join("") + `</div>`;
  }
  html += `<label>Bemerkung zur Prüfung (optional)</label><textarea id="inspNote" style="min-height:70px">${esc(S.insp.insp.note||"")}</textarea>
    <div style="margin:16px 0 40px"><button class="btn" style="width:100%" data-act="finish" ${req.length && done===req.length ? "" : "disabled"}>Prüfung abschließen</button>
    ${done<req.length ? `<div class="muted" style="margin-top:6px">Zum Abschließen müssen alle Positionen bewertet sein (bei Positionen mit Inhalt auch der Inhalt).</div>`:""}</div>`;
  return html;
}

async function saveResult(itemId, patch){
  const cur = S.insp.results[itemId] || { inspection_id: S.insp.insp.id, item_id: itemId, status: "ok", ist_menge: null, note: null };
  const next = { ...cur, ...patch };
  if (next.status === "ok"){ next.ist_menge = null; next.note = null; }
  const payload = { inspection_id: next.inspection_id, item_id: next.item_id, status: next.status, ist_menge: next.ist_menge, note: next.note };
  const { data, error } = await sb.from("inspection_results").upsert(payload, { onConflict: "inspection_id,item_id" }).select().single();
  if (error) return fail(error);
  S.insp.results[itemId] = data;
}

/* ---------- Fehlbestand ---------- */
async function viewFehlbestand(){
  const { data, error } = await sb.from("fehlbestand").select("*").order("fahrzeug").order("bereich").order("position");
  if (error) fail(error);
  const rows = data || [];
  S.fehl = rows;
  if (!rows.length) return `<h2>Fehlbestand</h2><div class="card muted">Aktuell wurde nichts als fehlend oder defekt gemeldet. 🎉</div>`;
  const open = rows.filter(r => !r.bestellt).length;
  const byV = {}; rows.forEach(r => (byV[r.fahrzeug] = byV[r.fahrzeug] || []).push(r));
  let html = `<div class="top"><h2>Fehlbestand</h2>
    <div class="row noprint"><button class="btn sec small" data-act="copy">Bestellliste kopieren</button><button class="btn sec small" data-act="print">Drucken</button></div></div>
    <div class="muted">${open} Position(en) noch nicht bestellt · basiert auf der jeweils letzten abgeschlossenen Prüfung</div>`;
  for (const [fz, list] of Object.entries(byV)){
    html += `<h3>${esc(fz)}${list[0].kennzeichen?" · "+esc(list[0].kennzeichen):""} <span style="text-transform:none;letter-spacing:0">(geprüft ${fmt(list[0].geprueft_am)} von ${esc(list[0].geprueft_von||"?")})</span></h3><div class="card">`;
    html += list.map(r => {
      const fehlmenge = r.ist_menge != null ? Math.max(r.soll_menge - r.ist_menge, 0) : null;
      return `<div class="item ${r.bestellt?"bestellt":""}"><label class="check" style="margin:0;color:inherit;font-size:inherit;font-weight:inherit">
        <input type="checkbox" data-act="bestellt" data-id="${r.result_id}" ${r.bestellt?"checked":""}>
        <span class="grow"><b>${r.parent_name ? esc(r.parent_name) + " › " : ""}${esc(r.position)}</b> <span class="tag ${r.status}">${r.status==="fehlt"?"Fehlt":"Defekt"}</span><br>
        <span class="muted">${esc(r.bereich)} · Soll ${r.soll_menge}${r.ist_menge!=null?` / Ist ${r.ist_menge}`:""}${fehlmenge!=null&&fehlmenge>0?` · <b>${fehlmenge} nachbestellen</b>`:""}${r.note?` · ${esc(r.note)}`:""}</span></span></label></div>`;
    }).join("") + `</div>`;
  }
  return html;
}

function bestellText(){
  const rows = (S.fehl||[]).filter(r => !r.bestellt);
  const byV = {}; rows.forEach(r => (byV[r.fahrzeug] = byV[r.fahrzeug] || []).push(r));
  let t = "Bestellliste ABC-Zug Kreis Heinsberg – " + new Date().toLocaleDateString("de-DE") + "\n";
  for (const [fz, list] of Object.entries(byV)){
    t += `\n${fz}\n` + list.map(r => {
      const n = r.ist_menge != null ? Math.max(r.soll_menge - r.ist_menge, 0) : r.soll_menge;
      return `- ${n}× ${r.parent_name ? r.parent_name + " › " : ""}${r.position} (${r.status === "fehlt" ? "fehlt" : "defekt"}${r.note ? ", " + r.note : ""})`;
    }).join("\n") + "\n";
  }
  return t;
}

/* ---------- Verwaltung ---------- */
async function viewVerwaltung(){
  if (S.mgVehicle) return viewMgVehicle();
  const [{ data: vehicles }, { data: profiles }] = await Promise.all([
    sb.from("vehicles").select("*").eq("active", true).order("sort").order("name"),
    sb.from("profiles").select("*").order("name")
  ]);
  return `<h2>Fahrzeuge</h2>
    ${(vehicles||[]).map(v => `<div class="card vehicle" data-act="mgopen" data-id="${v.id}"><div><b>${esc(v.name)}</b><div class="muted">${esc(v.kennzeichen||"")}</div></div><span class="muted">Checkliste bearbeiten →</span></div>`).join("") || `<div class="card muted">Noch keine Fahrzeuge.</div>`}
    <div class="card"><form id="vehForm" class="row">
      <div class="grow"><label style="margin-top:0">Name</label><input id="vName" required placeholder="z. B. GW-Mess 1"></div>
      <div class="grow"><label style="margin-top:0">Kennzeichen</label><input id="vKz" placeholder="optional"></div>
      <button class="btn" style="align-self:flex-end">Fahrzeug anlegen</button></form></div>
    ${isUM() ? await viewBenutzer() : `<h3>Benutzer</h3><div class="card">${(profiles||[]).map(p => `<div class="row item"><div class="grow">${esc(p.name||"(ohne Namen)")}</div><span class="muted">${ROLE_LABEL[p.role]||""}</span></div>`).join("")}</div>`}`;
}

/* ---------- Benutzerverwaltung (nur Admin) ---------- */
async function callAdmin(payload){
  const { data, error } = await sb.functions.invoke("admin-users", { body: payload });
  if (error){
    let m = error.message;
    try{ const b = await error.context.json(); if (b && b.error) m = b.error; }catch(_){}
    throw new Error(m);
  }
  if (data && data.error) throw new Error(data.error);
  return data;
}

async function viewMgVehicle(){

    sb.from("checklist_items").select("*").eq("vehicle_id", id).eq("active", true).order("bereich").order("sort").order("name")
  ]);
  const all = items || [];
  const tops = all.filter(i => !i.parent_id);
  const kidsOf = pid => all.filter(i => i.parent_id === pid);
  const groups = {}; tops.forEach(i => (groups[i.bereich] = groups[i.bereich] || []).push(i));
  return `<div class="top"><h2>${esc(v.name)}</h2><button class="btn sec small" data-act="mgback">← Zurück</button></div>
    ${Object.entries(groups).map(([b, list]) => `<h3>${esc(b)}</h3><div class="card">${list.map(i => {
      const kids = kidsOf(i.id);
      return `<div class="item">
        <div class="row"><div class="grow">${esc(i.name)} <span class="muted">· Soll ${i.soll_menge}${kids.length ? ` · ${kids.length} Inhalte` : ""}</span></div>
          <button class="btn sec small" data-act="delitem" data-id="${i.id}">Entfernen</button></div>
        ${kids.map(c => `<div class="row subitem"><div class="grow">↳ ${esc(c.name)} <span class="muted">· Soll ${c.soll_menge}</span></div>
          <button class="btn sec small" data-act="delitem" data-id="${c.id}">Entfernen</button></div>`).join("")}
        <details style="margin-top:8px"><summary class="muted">+ Inhalt hinzufügen (mehrere)</summary>
          <form class="childBulk" data-parent="${i.id}" data-bereich="${esc(i.bereich)}" style="margin-top:6px">
            <textarea name="t" placeholder="Pflaster; 10&#10;Verbandpäckchen; 2"></textarea>
            <p class="muted" style="margin:4px 0">Eine Zeile pro Inhalt: Bezeichnung; Menge</p>
            <button class="btn small">Inhalte hinzufügen</button></form></details>
      </div>`;
    }).join("")}</div>`).join("") || `<div class="card muted">Noch keine Positionen.</div>`}
    <h3>Position hinzufügen</h3>
    <div class="card"><form id="itemForm">
      <label style="margin-top:0">Gehört zu (optional – dann ist es ein Inhalt dieser Position)</label>
      <select id="iParent"><option value="">– eigenständige Position –</option>
        ${tops.map(t => `<option value="${t.id}">${esc(t.name)} (${esc(t.bereich)})</option>`).join("")}</select>
      <label>Bereich / Fach (bei Inhalten nicht nötig)</label><input id="iBereich" placeholder="z. B. Geräteraum links">
      <label>Bezeichnung</label><input id="iName" required placeholder="z. B. Dosimeter oder Verbandskasten">
      <label>Soll-Menge</label><input id="iSoll" type="number" min="0" value="1" required>
      <div style="margin-top:12px"><button class="btn">Hinzufügen</button></div></form></div>
    <h3>Mehrere auf einmal</h3>
    <div class="card"><form id="bulkForm">
      <p class="muted" style="margin-top:0">Eine Position pro Zeile: <code>Bereich; Bezeichnung; Menge</code><br>
      Zeilen mit <code>-</code> davor sind Inhalte der Zeile darüber: <code>- Bezeichnung; Menge</code></p>
      <textarea id="bulk" style="min-height:150px" placeholder="Geräteraum links; Dosimeter; 6&#10;Geräteraum links; Verbandskasten; 1&#10;- Pflaster; 10&#10;- Verbandpäckchen; 2&#10;Dach; Warnleuchte; 1"></textarea>
      <div style="margin-top:12px"><button class="btn">Alle hinzufügen</button></div></form></div>
    <div style="margin:20px 0 40px"><button class="btn sec small" data-act="delveh" data-id="${id}">Fahrzeug entfernen</button></div>`;

/* ---------- Historie ---------- */
async function viewHistorie(){
  const [{ data: vehicles }, { data, error }] = await Promise.all([
    sb.from("vehicles").select("id,name").order("name"),
    sb.from("inspections")
      .select("id,vehicle_id,completed_at,note,vehicles(name,kennzeichen),profiles(name),inspection_results(status)")
      .not("completed_at", "is", null).order("completed_at", { ascending: false }).limit(300)
  ]);
  if (error) fail(error);
  const sel = S.histVehicle || "";
  const list = (data || []).filter(x => !sel || x.vehicle_id === sel);
  S.histOpen = S.histOpen || {}; S.histDetail = S.histDetail || {};
  let html = `<h2>Historie der Prüfungen</h2>
    <select data-act="histfilter" style="margin-bottom:12px"><option value="">Alle Fahrzeuge</option>
      ${(vehicles||[]).map(v => `<option value="${v.id}" ${sel===v.id?"selected":""}>${esc(v.name)}</option>`).join("")}</select>
    <div class="muted" style="margin-bottom:8px">${list.length} abgeschlossene Prüfung(en)</div>`;
  if (!list.length) return html + `<div class="card muted">Noch keine abgeschlossenen Prüfungen.</div>`;
  html += list.map(x => {
    const c = { ok:0, fehlt:0, defekt:0 };
    (x.inspection_results || []).forEach(r => c[r.status] = (c[r.status] || 0) + 1);
    const det = S.histDetail[x.id];
    return `<div class="card">
      <div class="row"><div class="grow"><b>${esc(x.vehicles?.name || "?")}</b>${x.vehicles?.kennzeichen ? ` <span class="muted">· ${esc(x.vehicles.kennzeichen)}</span>` : ""}
        <div class="muted">${fmt(x.completed_at)} · von ${esc(x.profiles?.name || "unbekannt")}</div></div>
        <div class="row" style="gap:6px"><span class="tag ok">${c.ok} OK</span>${c.fehlt ? `<span class="tag fehlt">${c.fehlt} fehlt</span>` : ""}${c.defekt ? `<span class="tag defekt">${c.defekt} defekt</span>` : ""}</div></div>
      ${x.note ? `<div class="muted" style="margin-top:6px">Bemerkung: ${esc(x.note)}</div>` : ""}
      ${(c.fehlt || c.defekt) ? `<button class="btn sec small" style="margin-top:10px" data-act="histtoggle" data-id="${x.id}">${S.histOpen[x.id] ? "▾ Details ausblenden" : "▸ Was hat gefehlt?"}</button>` : ""}
      ${S.histOpen[x.id] ? (det ? `<div class="children">${det.length ? det.map(r => `<div class="subitem"><b>${r.checklist_items?.parent?.name ? esc(r.checklist_items.parent.name) + " › " : ""}${esc(r.checklist_items?.name || "?")}</b>
          <span class="tag ${r.status}">${r.status === "fehlt" ? "Fehlt" : "Defekt"}</span>
          <div class="muted">${esc(r.checklist_items?.bereich || "")}${r.ist_menge != null ? ` · Ist ${r.ist_menge} von ${r.checklist_items?.soll_menge ?? "?"}` : ""}${r.note ? ` · ${esc(r.note)}` : ""}</div></div>`).join("") : `<div class="muted">Keine Abweichungen.</div>`}</div>` : `<div class="muted" style="margin-top:8px">Lade …</div>`) : ""}
    </div>`;
  }).join("");
  return html;
}

/* ---------- Geräte ---------- */
function deviceForm(d, vehicles){
  d = d || {};
  return `<form class="devForm" data-id="${d.id||""}">
    <label style="margin-top:0">Bezeichnung</label><input name="name" required value="${esc(d.name)}" placeholder="z. B. Dosisleistungsmessgerät">
    <label>Seriennummer</label><input name="seriennummer" value="${esc(d.seriennummer)}">
    <label>Fahrzeug</label><select name="vehicle_id"><option value="">– keinem Fahrzeug zugeordnet –</option>
      ${vehicles.map(v => `<option value="${v.id}" ${d.vehicle_id===v.id?"selected":""}>${esc(v.name)}</option>`).join("")}</select>
    <label>Standort (falls kein Fahrzeug)</label><input name="standort" value="${esc(d.standort)}" placeholder="z. B. Lager, Gerätehaus">
    <label>Prüfintervall (Monate)</label><input name="intervall_monate" type="number" min="1" required value="${d.intervall_monate ?? 12}">
    <label>Letzte Prüfung</label><input name="letzte_pruefung" type="date" value="${d.letzte_pruefung||""}">
    <label>Nächste Prüfung (leer = automatisch aus letzter Prüfung + Intervall)</label><input name="naechste_pruefung" type="date" value="${d.naechste_pruefung||""}">
    <label>Bemerkung</label><input name="bemerkung" value="${esc(d.bemerkung)}">
    <div class="row" style="margin-top:12px"><button class="btn">${d.id?"Speichern":"Gerät anlegen"}</button>
      ${d.id?`<button type="button" class="btn sec" data-act="devcancel">Abbrechen</button>`:""}</div>
  </form>`;
}

async function viewGeraete(){
  const [{ data: devs, error }, { data: vehicles }] = await Promise.all([
    sb.from("devices").select("*").eq("active", true).order("naechste_pruefung", { ascending: true, nullsFirst: true }).order("name"),
    sb.from("vehicles").select("id,name").eq("active", true).order("name")
  ]);
  if (error) fail(error);
  const list = devs || []; S.devs = list;
  const vname = Object.fromEntries((vehicles||[]).map(v => [v.id, v.name]));
  const n = d => daysUntil(d.naechste_pruefung);
  const over = list.filter(d => n(d) !== null && n(d) < 0).length;
  const soon = list.filter(d => n(d) !== null && n(d) >= 0 && n(d) <= 30).length;
  let html = `<h2>Geräte &amp; Prüffristen</h2>
    <div class="muted">${list.length} Geräte · <b style="color:var(--bad)">${over} überfällig</b> · <b style="color:var(--warn)">${soon} in den nächsten 30 Tagen fällig</b></div>
    <details class="card" style="margin-top:12px"><summary><b>+ Gerät hinzufügen</b></summary><div style="margin-top:8px">${deviceForm(null, vehicles||[])}</div></details>`;
  html += list.map(d => {
    if (S.editDevice === d.id) return `<div class="card">${deviceForm(d, vehicles||[])}</div>`;
    const k = n(d);
    let tag = `<span class="tag grey">Kein Termin</span>`;
    if (k !== null) tag = k < 0 ? `<span class="tag fehlt">Überfällig seit ${-k} Tg.</span>`
      : k <= 30 ? `<span class="tag defekt">Fällig in ${k} Tg.</span>` : `<span class="tag ok">Fällig in ${k} Tg.</span>`;
    const ort = d.vehicle_id ? vname[d.vehicle_id] : d.standort;
    return `<div class="card">
      <div class="row"><div class="grow"><b>${esc(d.name)}</b>${d.seriennummer?` <span class="muted">· SN ${esc(d.seriennummer)}</span>`:""}
        <div class="muted">${esc(ort||"ohne Standort")} · alle ${d.intervall_monate} Monate</div></div>${tag}</div>
      <div class="muted" style="margin-top:6px">Letzte Prüfung: ${fmtDate(d.letzte_pruefung)} · Nächste: <b>${fmtDate(d.naechste_pruefung)}</b>${d.bemerkung?` · ${esc(d.bemerkung)}`:""}</div>
      <div class="row" style="margin-top:10px">
        <input type="date" id="chk-${d.id}" value="${today()}" style="width:auto">
        <button class="btn small" data-act="devcheck" data-id="${d.id}">Prüfung erfassen</button>
        <button class="btn sec small" data-act="devedit" data-id="${d.id}">Bearbeiten</button>
        <button class="btn sec small" data-act="devdel" data-id="${d.id}">Entfernen</button></div>
    </div>`;
  }).join("") || `<div class="card muted">Noch keine Geräte eingetragen.</div>`;
  return html;
}

/* ---------- Lager ---------- */
function stockForm(s){
  s = s || {};
  return `<form class="stockForm" data-id="${s.id||""}">
    <label style="margin-top:0">Bezeichnung</label><input name="name" required value="${esc(s.name)}" placeholder="z. B. Einweghandschuhe Gr. L">
    <div class="row"><div class="grow"><label>Menge</label><input name="menge" type="number" min="0" required value="${s.menge ?? 0}"></div>
      <div class="grow"><label>Einheit</label><input name="einheit" value="${esc(s.einheit||"Stk")}"></div>
      <div class="grow"><label>Mindestmenge</label><input name="mindestmenge" type="number" min="0" value="${s.mindestmenge ?? ""}" placeholder="optional"></div></div>
    <label>Kategorie</label><input name="kategorie" value="${esc(s.kategorie)}" placeholder="z. B. Schutzausrüstung">
    <label>Lagerort</label><input name="lagerort" value="${esc(s.lagerort)}" placeholder="z. B. Regal 3">
    <label>Bemerkung</label><input name="bemerkung" value="${esc(s.bemerkung)}">
    <div class="row" style="margin-top:12px"><button class="btn">${s.id?"Speichern":"Anlegen"}</button>
      ${s.id?`<button type="button" class="btn sec" data-act="stockcancel">Abbrechen</button>`:""}</div>
  </form>`;
}

async function viewLager(){
  const { data, error } = await sb.from("stock").select("*").eq("active", true).order("kategorie").order("name");
  if (error) fail(error);
  const list = data || [];
  const low = list.filter(s => s.mindestmenge != null && s.menge <= s.mindestmenge).length;
  const groups = {}; list.forEach(s => (groups[s.kategorie || "Ohne Kategorie"] = groups[s.kategorie || "Ohne Kategorie"] || []).push(s));
  let html = `<h2>Lagerbestand</h2>
    <div class="muted">${list.length} Artikel${low?` · <b style="color:var(--bad)">${low} unter Mindestmenge</b>`:""}</div>
    <details class="card" style="margin-top:12px"><summary><b>+ Artikel hinzufügen</b></summary><div style="margin-top:8px">${stockForm(null)}</div></details>
    <input id="stockSearch" type="search" placeholder="Suchen …" style="margin-bottom:10px">`;
  for (const [kat, items] of Object.entries(groups)){
    html += `<h3>${esc(kat)}</h3><div class="card">` + items.map(s => {
      if (S.editStock === s.id) return `<div class="item">${stockForm(s)}</div>`;
      const isLow = s.mindestmenge != null && s.menge <= s.mindestmenge;
      return `<div class="item" data-sname="${esc((s.name+" "+(s.lagerort||"")+" "+kat).toLowerCase())}">
        <div class="row"><div class="grow" style="flex:1 1 200px"><b>${esc(s.name)}</b> ${isLow?`<span class="tag fehlt">Wenig</span>`:""}
          <div class="muted">${esc(s.lagerort||"kein Lagerort")}${s.mindestmenge!=null?` · Min. ${s.mindestmenge}`:""}${s.bemerkung?` · ${esc(s.bemerkung)}`:""}</div></div>
          <div class="stepper"><button data-act="stockstep" data-d="-1" data-id="${s.id}" aria-label="weniger">−</button><input type="number" min="0" inputmode="numeric" value="${s.menge}" data-act="menge" data-id="${s.id}"><button data-act="stockstep" data-d="1" data-id="${s.id}" aria-label="mehr">+</button><span class="muted">${esc(s.einheit)}</span></div></div>
        <div class="row" style="margin-top:8px"><button class="btn sec small" data-act="stockedit" data-id="${s.id}">Bearbeiten</button>
          <button class="btn sec small" data-act="stockdel" data-id="${s.id}">Entfernen</button></div></div>`;
    }).join("") + `</div>`;
  }
  if (!list.length) html += `<div class="card muted">Noch nichts im Lager eingetragen.</div>`;
  return html;
}

/* ---------- Rendering ---------- */
async function render(){
  document.body.classList.add("busy");
  try{ await renderInner(); } finally{ document.body.classList.remove("busy"); }
}
async function renderInner(){
  if (!S.session) return renderLogin();
  if (!S.profile){
    $root.innerHTML = `<header><h1>ABC-Zug Kreis Heinsberg</h1><button class="btn sec small" data-act="logout">Abmelden</button></header>
      <main><div class="err">Für dein Konto wurde noch kein Profil angelegt. Bitte den Admin kontaktieren.</div></main>`;
    return;
  }
  let content = "";
  try{
    if (S.tab === "pruefen") content = await viewPruefen();
    else if (S.tab === "fehlbestand" && isGW()) content = await viewFehlbestand();
    else if (S.tab === "historie" && isGW()) content = await viewHistorie();
    else if (S.tab === "geraete" && isGW()) content = await viewGeraete();
    else if (S.tab === "lager" && isGW()) content = await viewLager();
    else if (S.tab === "verwaltung" && isGW()) content = await viewVerwaltung();
    else content = await viewPruefen();
  }catch(e){ fail(e); }
  $root.innerHTML = shell(content);
  document.body.classList.toggle("nonav", !document.querySelector("nav"));
  S.err = null; S.msg = null;
  bindForms();
}

function bindForms(){
  const f = id => document.getElementById(id);
  if (f("vehForm")) f("vehForm").onsubmit = async e => {
    e.preventDefault();
    const { error } = await sb.from("vehicles").insert({ name: f("vName").value.trim(), kennzeichen: f("vKz").value.trim() || null });
    if (error) fail(error); render();
  };
  if (f("itemForm")) f("itemForm").onsubmit = async e => {
    e.preventDefault();
    const parentId = f("iParent").value || null;
    let bereich = f("iBereich").value.trim();
    if (parentId){
      const { data: p } = await sb.from("checklist_items").select("bereich").eq("id", parentId).single();
      bereich = p ? p.bereich : bereich;
    }
    if (!bereich){ S.err = "Bitte einen Bereich angeben."; return render(); }
    const { error } = await sb.from("checklist_items").insert({ vehicle_id: S.mgVehicle, parent_id: parentId, bereich, name: f("iName").value.trim(), soll_menge: parseInt(f("iSoll").value,10) || 0 });
    if (error) fail(error); render();
  };
  document.querySelectorAll("form.childBulk").forEach(form => form.onsubmit = async e => {
    e.preventDefault();
    const rows = form.elements.t.value.split("\n").map(l => l.trim().replace(/^-\s*/, "")).filter(Boolean).map((l, n) => {
      const [name, menge] = l.split(";").map(x => x.trim());
      return { vehicle_id: S.mgVehicle, parent_id: form.dataset.parent, bereich: form.dataset.bereich, name, soll_menge: parseInt(menge,10) || 1, sort: n };
    });
    if (!rows.length) return;
    const { error } = await sb.from("checklist_items").insert(rows);
    if (error) fail(error); else S.msg = rows.length + " Inhalte hinzugefügt.";
    render();
  });
  if (f("bulkForm")) f("bulkForm").onsubmit = async e => {
    e.preventDefault();
    const groups = [];
    f("bulk").value.split("\n").map(l => l.trim()).filter(Boolean).forEach(l => {
      if (l.startsWith("-")){
        const [name, menge] = l.slice(1).split(";").map(x => x.trim());
        if (groups.length && name) groups[groups.length-1].kids.push({ name, soll_menge: parseInt(menge,10) || 1 });
      } else {
        const [bereich, name, menge] = l.split(";").map(x => x.trim());
        groups.push({ bereich: bereich || "Allgemein", name: name || bereich, soll_menge: parseInt(menge,10) || 1, kids: [] });
      }
    });
    if (!groups.length) return;
    let count = 0;
    for (let n = 0; n < groups.length; n++){
      const g = groups[n];
      const { data: p, error } = await sb.from("checklist_items").insert({ vehicle_id: S.mgVehicle, bereich: g.bereich, name: g.name, soll_menge: g.soll_menge, sort: n }).select().single();
      if (error){ fail(error); break; }
      count++;
      if (g.kids.length){
        const { error: e2 } = await sb.from("checklist_items").insert(g.kids.map((k, j) => ({ vehicle_id: S.mgVehicle, parent_id: p.id, bereich: g.bereich, name: k.name, soll_menge: k.soll_menge, sort: j })));
        if (e2){ fail(e2); break; }
        count += g.kids.length;
      }
    }
    if (!S.err) S.msg = count + " Positionen hinzugefügt.";
    render();
  };
  document.querySelectorAll("form.devForm").forEach(form => form.onsubmit = async e => {
    e.preventDefault();
    const fd = Object.fromEntries(new FormData(form));
    const intervall = parseInt(fd.intervall_monate, 10) || 12;
    const letzte = fd.letzte_pruefung || null;
    const payload = {
      name: fd.name.trim(), seriennummer: fd.seriennummer.trim() || null, vehicle_id: fd.vehicle_id || null,
      standort: fd.standort.trim() || null, intervall_monate: intervall, letzte_pruefung: letzte,
      naechste_pruefung: fd.naechste_pruefung || (letzte ? addMonths(letzte, intervall) : null),
      bemerkung: fd.bemerkung.trim() || null
    };
    const id = form.dataset.id;
    const { error } = id ? await sb.from("devices").update(payload).eq("id", id) : await sb.from("devices").insert(payload);
    if (error) fail(error); else { S.editDevice = null; S.msg = "Gerät gespeichert."; }
    render();
  });
  document.querySelectorAll("form.stockForm").forEach(form => form.onsubmit = async e => {
    e.preventDefault();
    const fd = Object.fromEntries(new FormData(form));
    const payload = {
      name: fd.name.trim(), menge: parseInt(fd.menge, 10) || 0, einheit: fd.einheit.trim() || "Stk",
      mindestmenge: fd.mindestmenge === "" ? null : parseInt(fd.mindestmenge, 10),
      kategorie: fd.kategorie.trim() || null, lagerort: fd.lagerort.trim() || null, bemerkung: fd.bemerkung.trim() || null,
      updated_at: new Date().toISOString()
    };
    const id = form.dataset.id;
    const { error } = id ? await sb.from("stock").update(payload).eq("id", id) : await sb.from("stock").insert(payload);
    if (error) fail(error); else { S.editStock = null; S.msg = "Artikel gespeichert."; }
    render();
  });
  if (f("userForm")) f("userForm").onsubmit = async e => {
    e.preventDefault();
    const fd = Object.fromEntries(new FormData(f("userForm")));
    try{
      await callAdmin({ action: "create", username: fd.username.trim(), password: fd.password, role: fd.role || "nutzer" });
      S.msg = `Benutzer ${fd.username.trim()} wurde angelegt.`;
    }catch(err){ fail(err); }
    render();
  };
  document.querySelectorAll("form.pwForm").forEach(form => form.onsubmit = async e => {
    e.preventDefault();
    const fd = Object.fromEntries(new FormData(form));
    try{
      await callAdmin({ action: "set_password", id: form.dataset.id, password: fd.password });
      S.msg = "Passwort wurde geändert."; S.pwUser = null;
    }catch(err){ fail(err); }
    render();
  });
  const q = f("stockSearch");
  if (q) q.oninput = () => {
    const t = q.value.trim().toLowerCase();
    document.querySelectorAll("[data-sname]").forEach(r => r.classList.toggle("hidden", !r.dataset.sname.includes(t)));
  };
  const n = f("inspNote");
  if (n) n.onchange = async () => {
    S.insp.insp.note = n.value;
    const { error } = await sb.from("inspections").update({ note: n.value }).eq("id", S.insp.insp.id);
    if (error) { fail(error); render(); }
  };
}

/* ---------- Events ---------- */
document.addEventListener("click", async e => {
  const el = e.target.closest("[data-act]");
  if (!el) return;
  const act = el.dataset.act, id = el.dataset.id;
  if (["ist","note","role","bestellt","menge","histfilter"].includes(act)) return; // handled via change
  S.err = null;
  if (act === "logout"){ await sb.auth.signOut(); return; }
  if (act === "tab"){ S.tab = el.dataset.tab; S.insp = null; S.mgVehicle = null; S.editDevice = null; S.editStock = null; S.pwUser = null; return render(); }
  if (act === "toggle"){ S.open = S.open || {}; S.open[id] = !S.open[id]; const keep = window.scrollY; await render(); window.scrollTo(0, keep); return; }
  if (act === "allok"){
    const keep = window.scrollY;
    const rows = S.insp.items.filter(c => c.parent_id === id && !S.insp.results[c.id])
      .map(c => ({ inspection_id: S.insp.insp.id, item_id: c.id, status: "ok" }));
    if (rows.length){
      const { data, error } = await sb.from("inspection_results").upsert(rows, { onConflict: "inspection_id,item_id" }).select();
      if (error) fail(error); else data.forEach(r => S.insp.results[r.item_id] = r);
    }
    await render(); window.scrollTo(0, keep); return;
  }
  if (act === "stockstep"){
    const inp = el.closest(".item").querySelector('input[data-act="menge"]');
    const m = Math.max((parseInt(inp.value, 10) || 0) + parseInt(el.dataset.d, 10), 0);
    inp.value = m;
    const { error } = await sb.from("stock").update({ menge: m, updated_at: new Date().toISOString() }).eq("id", id);
    if (error){ fail(error); return render(); }
    return;
  }
  if (act === "histtoggle"){
    S.histOpen = S.histOpen || {}; S.histDetail = S.histDetail || {};
    S.histOpen[id] = !S.histOpen[id];
    if (S.histOpen[id] && !S.histDetail[id]){
      const { data, error } = await sb.from("inspection_results")
        .select("status,ist_menge,note,checklist_items(name,bereich,soll_menge,parent:parent_id(name))")
        .eq("inspection_id", id).neq("status", "ok");
      if (error) fail(error); else S.histDetail[id] = data || [];
    }
    return render();
  }
  if (act === "pwopen"){ S.pwUser = id; return render(); }
  if (act === "pwcancel"){ S.pwUser = null; return render(); }
  if (act === "ban"){
    try{ await callAdmin({ action: "ban", id, banned: el.dataset.banned === "1" }); S.msg = el.dataset.banned === "1" ? "Benutzer gesperrt." : "Benutzer entsperrt."; }catch(err){ fail(err); }
    return render();
  }
  if (act === "userdel"){
    if (!confirm(`Benutzer ${el.dataset.name} wirklich löschen?`)) return;
    try{ await callAdmin({ action: "delete", id }); S.msg = "Benutzer gelöscht."; }catch(err){ fail(err); }
    return render();
  }
  if (act === "devedit"){ S.editDevice = id; return render(); }
  if (act === "devcancel"){ S.editDevice = null; return render(); }
  if (act === "devdel"){
    if (!confirm("Gerät wirklich entfernen?")) return;
    const { error } = await sb.from("devices").update({ active: false }).eq("id", id);
    if (error) fail(error); return render();
  }
  if (act === "devcheck"){
    const d = (S.devs||[]).find(x => x.id === id);
    const date = document.getElementById("chk-" + id).value;
    if (!d || !date){ S.err = "Bitte ein Prüfdatum wählen."; return render(); }
    const r1 = await sb.from("device_checks").insert({ device_id: id, geprueft_am: date });
    if (r1.error){ fail(r1.error); return render(); }
    const r2 = await sb.from("devices").update({ letzte_pruefung: date, naechste_pruefung: addMonths(date, d.intervall_monate) }).eq("id", id);
    if (r2.error) fail(r2.error); else S.msg = `Prüfung erfasst. Nächste Prüfung: ${fmtDate(addMonths(date, d.intervall_monate))}.`;
    return render();
  }
  if (act === "stockedit"){ S.editStock = id; return render(); }
  if (act === "stockcancel"){ S.editStock = null; return render(); }
  if (act === "stockdel"){
    if (!confirm("Artikel wirklich entfernen?")) return;
    const { error } = await sb.from("stock").update({ active: false }).eq("id", id);
    if (error) fail(error); return render();
  }
  if (act === "start"){ await startInspection(id); return render(); }
  if (act === "back"){ S.insp = null; S.open = {}; return render(); }
  if (act === "status"){
    const keep = window.scrollY;
    await saveResult(id, { status: el.dataset.s });
    await render(); window.scrollTo(0, keep); return;
  }
  if (act === "finish"){
    const { error } = await sb.from("inspections").update({ completed_at: new Date().toISOString(), note: document.getElementById("inspNote").value || null }).eq("id", S.insp.insp.id);
    if (error) fail(error); else { S.msg = "Prüfung gespeichert. Danke!"; S.insp = null; }
    return render();
  }
  if (act === "copy"){
    try{ await navigator.clipboard.writeText(bestellText()); S.msg = "Bestellliste in die Zwischenablage kopiert."; }catch(_){ S.err = "Kopieren nicht möglich."; }
    return render();
  }
  if (act === "print"){ window.print(); return; }
  if (act === "mgopen"){ S.mgVehicle = id; return render(); }
  if (act === "mgback"){ S.mgVehicle = null; return render(); }
  if (act === "delitem"){
    const { error } = await sb.from("checklist_items").update({ active: false }).or(`id.eq.${id},parent_id.eq.${id}`);
    if (error) fail(error); return render();
  }
  if (act === "delveh"){
    if (!confirm("Fahrzeug wirklich entfernen? Die bisherigen Prüfungen bleiben gespeichert.")) return;
    const { error } = await sb.from("vehicles").update({ active: false }).eq("id", id);
    if (error) fail(error); S.mgVehicle = null; return render();
  }
});

document.addEventListener("change", async e => {
  const el = e.target.closest("[data-act]");
  if (!el) return;
  const act = el.dataset.act, id = el.dataset.id;
  if (act === "ist"){ await saveResult(id, { ist_menge: el.value === "" ? null : parseInt(el.value,10) }); if (S.err) render(); }
  if (act === "note"){ await saveResult(id, { note: el.value.trim() || null }); if (S.err) render(); }
  if (act === "histfilter"){ S.histVehicle = el.value; return render(); }
  if (act === "menge"){
    const m = parseInt(el.value, 10);
    if (isNaN(m) || m < 0){ S.err = "Ungültige Menge."; return render(); }
    const { error } = await sb.from("stock").update({ menge: m, updated_at: new Date().toISOString() }).eq("id", id);
    if (error) fail(error); else S.msg = "Menge gespeichert.";
    return render();
  }
  if (act === "role"){
    const { error } = await sb.from("profiles").update({ role: el.value }).eq("id", id);
    if (error) fail(error); else S.msg = "Rolle geändert.";
    render();
  }
  if (act === "bestellt"){
    const { error } = await sb.from("inspection_results").update({ bestellt: el.checked }).eq("id", id);
    if (error) fail(error);
    render();
  }
});

/* ---------- Start ---------- */
async function loadProfile(){
  const { data } = await sb.from("profiles").select("*").eq("id", S.session.user.id).maybeSingle();
  S.profile = data;
}
sb.auth.onAuthStateChange(async (_evt, session) => {
  S.session = session;
  S.profile = null; S.insp = null; S.mgVehicle = null;
  if (session) setTimeout(async () => { await loadProfile(); render(); }, 0);
  else render();
});
</script>
